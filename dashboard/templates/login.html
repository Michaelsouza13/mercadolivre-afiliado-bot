<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Maika Promos</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a; color: #e2e8f0; min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
        }
        .login-box {
            background: #1e293b; border: 1px solid #334155; border-radius: 12px;
            padding: 2rem; width: 100%; max-width: 360px;
        }
        h1 { font-size: 1.25rem; margin-bottom: 1.5rem; text-align: center; }
        label { display: block; font-size: 0.8rem; color: #94a3b8; margin-bottom: 0.25rem; font-weight: 500; }
        input {
            width: 100%; padding: 0.5rem 0.75rem; font-size: 0.875rem;
            background: #0f172a; color: #e2e8f0; border: 1px solid #475569;
            border-radius: 6px; margin-bottom: 1rem;
        }
        input:focus { outline: none; border-color: #2563eb; }
        .btn {
            width: 100%; padding: 0.6rem; background: #2563eb; color: #fff;
            border: none; border-radius: 6px; cursor: pointer; font-size: 0.875rem; font-weight: 500;
        }
        .btn:hover { background: #1d4ed8; }
        .error { color: #f87171; font-size: 0.8rem; text-align: center; margin-bottom: 0.75rem; }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>Maika Promos</h1>
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
        <form method="POST" action="/login">
            <label for="password">Senha</label>
            <input type="password" id="password" name="password" required autofocus>
            <button type="submit" class="btn">Entrar</button>
        </form>
    </div>
</body>
</html>
