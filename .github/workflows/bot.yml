name: Bot ML Afiliado

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Garantir que diretorio cache existe
        run: mkdir -p cache/

      - name: Restaurar cache de ofertas enviadas
        uses: actions/cache@v4
        with:
          path: cache/
          key: ml-offers-cache-${{ github.run_id }}
          restore-keys: |
            ml-offers-cache-

      - name: Executar bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AFFILIATE_TAG: ${{ secrets.AFFILIATE_TAG }}
          ML_CATEGORY: ${{ vars.ML_CATEGORY || '' }}
          ML_PAGES: ${{ vars.ML_PAGES || '3' }}
          ML_MAX_PAGES: ${{ vars.ML_MAX_PAGES || '20' }}
          MAX_OFFERS_PER_RUN: ${{ vars.MAX_OFFERS_PER_RUN || '10' }}
          ML_PROMOTION_TYPE: ${{ vars.ML_PROMOTION_TYPE || '' }}
          MIN_DISCOUNT: ${{ vars.MIN_DISCOUNT || '0' }}
          SEND_DELAY_SECONDS: ${{ vars.SEND_DELAY_SECONDS || '60' }}
          CACHE_EXPIRY_DAYS: ${{ vars.CACHE_EXPIRY_DAYS || '7' }}
          INCLUDE_KEYWORDS: ${{ vars.INCLUDE_KEYWORDS || '' }}
          EXCLUDE_KEYWORDS: ${{ vars.EXCLUDE_KEYWORDS || '' }}
          CHANNELS: ${{ vars.CHANNELS || '' }}
          CHANNEL_PERFUMES_TELEGRAM: ${{ secrets.CHANNEL_PERFUMES_TELEGRAM || '' }}
          CHANNEL_PERFUMES_WHATSAPP: ${{ secrets.CHANNEL_PERFUMES_WHATSAPP || '' }}
          CHANNEL_PERFUMES_INCLUDE: ${{ vars.CHANNEL_PERFUMES_INCLUDE || '' }}
          CHANNEL_PERFUMES_EXCLUDE: ${{ vars.CHANNEL_PERFUMES_EXCLUDE || '' }}
          ALIEXPRESS_APP_KEY: ${{ secrets.ALIEXPRESS_APP_KEY || '' }}
          ALIEXPRESS_APP_SECRET: ${{ secrets.ALIEXPRESS_APP_SECRET || '' }}
          ALIEXPRESS_TRACKING_ID: ${{ vars.ALIEXPRESS_TRACKING_ID || '' }}
          ALIEXPRESS_MAX_OFFERS: ${{ vars.ALIEXPRESS_MAX_OFFERS || '5' }}
          ALIEXPRESS_CATEGORY_IDS: ${{ vars.ALIEXPRESS_CATEGORY_IDS || '' }}
          ALIEXPRESS_KEYWORDS: ${{ vars.ALIEXPRESS_KEYWORDS || '' }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL || '' }}
          BOT_API_KEY: ${{ secrets.BOT_API_KEY || '' }}
          ZAP_API_TOKEN: ${{ secrets.ZAP_API_TOKEN }}
          ZAP_API_INSTANCE_ID: ${{ secrets.ZAP_API_INSTANCE_ID }}
          ZAP_API_GROUP_JID: ${{ secrets.ZAP_API_GROUP_JID }}
        run: python src/bot.py
