name: Bot ML Afiliado

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Garantir que diretorio cache existe
        run: mkdir -p cache/

      - name: Restaurar cache de ofertas enviadas
        uses: actions/cache@v4
        with:
          path: cache/
          key: ml-offers-cache-${{ github.run_id }}
          restore-keys: |
            ml-offers-cache-

      - name: Executar bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AFFILIATE_TAG: ${{ secrets.AFFILIATE_TAG }}
          ML_CATEGORY: ${{ vars.ML_CATEGORY || '' }}
          ML_PAGES: ${{ vars.ML_PAGES || '3' }}
          MAX_OFFERS_PER_RUN: ${{ vars.MAX_OFFERS_PER_RUN || '10' }}
          ML_PROMOTION_TYPE: ${{ vars.ML_PROMOTION_TYPE || '' }}
          MIN_DISCOUNT: ${{ vars.MIN_DISCOUNT || '0' }}
          SEND_DELAY_SECONDS: ${{ vars.SEND_DELAY_SECONDS || '60' }}
          CACHE_EXPIRY_DAYS: ${{ vars.CACHE_EXPIRY_DAYS || '7' }}
        run: python src/bot.py
